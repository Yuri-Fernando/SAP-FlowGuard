name: sap-flowguard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowguard
      POSTGRES_USER: flowguard
      POSTGRES_PASSWORD: flowguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowguard -d flowguard"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  sap-mock:
    build: .
    command: ["uvicorn", "mock_sap.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      DEMO_SCENARIO: ${DEMO_SCENARIO:-billing_without_fi}
    ports:
      - "8080:8080"

  flowguard-api:
    build: .
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      SAP_MODE: ${SAP_MODE:-mock}
      SAP_MOCK_BASE_URL: http://sap-mock:8080
      DATABASE_URL: postgresql+psycopg://flowguard:flowguard@postgres:5432/flowguard
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sap-mock:
        condition: service_started
    ports:
      - "8000:8000"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: flowguard
      DB_POSTGRESDB_USER: flowguard
      DB_POSTGRESDB_PASSWORD: flowguard
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-this-local-development-key}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_USER_MANAGEMENT_DISABLED: ${N8N_USER_MANAGEMENT_DISABLED:-true}
      FLOWGUARD_API_URL: http://flowguard-api:8000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      flowguard-api:
        condition: service_started
    ports:
      - "5678:5678"

volumes:
  postgres_data:
  redis_data:
  n8n_data:

